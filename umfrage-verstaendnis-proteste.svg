<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="title desc"><title id="title">Verständnis für Jugendproteste</title><desc id="desc">Forsa für stern und RTL, 29. bis 30. Oktober 2026, 1.006 Befragte. 83 Prozent Verständnis, 16 Prozent kein Verständnis, 1 Prozent weiß nicht.</desc><path d="M180,180 L180.00000,24.00000 A156,156 0 1 1 43.29616,104.84643 Z" fill="#1552d5" stroke="#fff" stroke-width="1.5"><title>Verständnis: 83 Prozent</title></path><path d="M180,180 L43.29616,104.84643 A156,156 0 0 1 170.20468,24.30783 Z" fill="#73849b" stroke="#fff" stroke-width="1.5"><title>Kein Verständnis: 16 Prozent</title></path><path d="M180,180 L170.20468,24.30783 A156,156 0 0 1 180.00000,24.00000 Z" fill="#dce2eb" stroke="#fff" stroke-width="1.5"><title>Weiß nicht: 1 Prozent</title></path></svg>